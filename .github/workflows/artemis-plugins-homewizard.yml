name: Artemis.Plugins.Modules.HomeWizard - Build and upload

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'src/Artemis.Plugins.Modules.HomeWizard/**'

jobs:
  upload:
    uses: ./.github/workflows/plugin-upload.yml
    with:
      projectPath: 'src/Artemis.Plugins.Modules.HomeWizard/Artemis.Plugins.Modules.HomeWizard.csproj'
    secrets:
      WORKSHOP_PAT: ${{ secrets.WORKSHOP_PAT }}

